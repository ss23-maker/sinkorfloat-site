<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sink or Float</title>
<meta name="description" content="Sink or Float: a water puzzle game. Flip the levers, steer the water and sink the boats in the right order before the clock runs out.">
<link rel="icon" href="art/favicon.png">
<link rel="apple-touch-icon" href="art/apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Poppins:wght@700;800&display=swap">
<style>
:root { --bg: #070B1F; --ink: #EAF0FF; --muted: #A9B4D6; --aqua: #3ADCFF; --gold: #FFC93C; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(120% 70% at 50% 0%, #142057 0%, var(--bg) 60%); color: var(--ink);
  font-family: 'Inter', 'Segoe UI', system-ui, sans-serif; font-size: 17px; line-height: 1.6; display: flex; align-items: center; justify-content: center;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 560px; text-align: center; }
.icon { width: 132px; height: 132px; border-radius: 30px; box-shadow: 0 18px 50px rgba(58, 220, 255, 0.18); }
h1 { font-family: 'Poppins', sans-serif; font-weight: 800; font-size: 46px; line-height: 1.05; margin: 22px 0 8px; }
h1 span { color: var(--gold); }
p { margin: 0 0 14px; color: var(--muted); }
.soon { display: inline-block; margin-top: 10px; padding: 12px 22px; border-radius: 999px; background: var(--gold); color: #1B1300; font-family: 'Poppins', sans-serif; font-weight: 800; text-decoration: none; }
footer { margin-top: 34px; font-size: 15px; color: var(--muted); }
footer a { color: var(--aqua); font-weight: 700; }
</style>
</head>
<body>
<main>
<img class="icon" src="art/icon.png" alt="Sink or Float icon: a sailboat filling with water">
<h1>Sink or <span>Float</span></h1>
<p>Flip the levers, steer the water and sink the boats in the right order before the clock runs out. A hundred levels across ten seas, with Bilge the otter along for the voyage.</p>
<span class="soon">Coming soon to Google Play</span>
<footer>
<p>Made by Sportsphere Media Pty Ltd · <a href="privacy.html">Privacy policy</a> · <a href="mailto:hello@orrery.site">hello@orrery.site</a></p>
</footer>
</main>
</body>
</html>
